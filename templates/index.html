<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Agent - Knowledge Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #eee; height: 100vh; display: flex;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 260px; background: #16213e; display: flex; flex-direction: column;
    border-right: 1px solid #0f3460; flex-shrink: 0;
  }
  .sidebar h2 { padding: 16px; font-size: 16px; color: #e94560; border-bottom: 1px solid #0f3460; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item {
    padding: 10px 12px; cursor: pointer; border-radius: 6px; margin-bottom: 4px;
    font-size: 13px; transition: background .15s;
  }
  .session-item:hover { background: #0f3460; }
  .session-item.active { background: #e94560; color: #fff; }
  .sidebar-actions { padding: 12px; border-top: 1px solid #0f3460; }
  .btn {
    width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-new { background: #e94560; color: #fff; }
  .btn-notes { background: #0f3460; color: #eee; margin-top: 6px; }

  /* ---- Main ---- */
  .main { flex: 1; display: flex; flex-direction: column; }
  .header {
    padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .header .status { color: #4ecca3; font-size: 12px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: #e94560; }
  .msg.agent { align-self: flex-start; background: #0f3460; }
  .msg.system { align-self: center; background: transparent; color: #888; font-size: 12px; }

  .trace-block {
    margin-top: 6px; padding: 6px 8px; border-radius: 4px;
    background: rgba(0,0,0,0.2); font-size: 11px; color: #aaa;
    font-family: "Consolas", "Courier New", monospace;
  }
  .trace-block .tool-name { color: #f0c040; }
  .trace-block .tool-args { color: #888; }
  .trace-block .tool-result { color: #4ecca3; }

  /* ---- Input ---- */
  .input-area {
    padding: 12px 20px; background: #16213e; border-top: 1px solid #0f3460;
    display: flex; gap: 8px;
  }
  .input-area input {
    flex: 1; padding: 10px 14px; border: 1px solid #0f3460; border-radius: 8px;
    background: #1a1a2e; color: #eee; font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: #e94560; }
  .input-area button {
    padding: 10px 20px; border: none; border-radius: 8px;
    background: #e94560; color: #fff; cursor: pointer; font-size: 14px;
  }
  .input-area button:hover { opacity: 0.85; }

  /* ---- Notes Modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #16213e; border-radius: 10px; padding: 20px; max-width: 500px; width: 90%;
    max-height: 70vh; overflow-y: auto;
  }
  .modal h3 { color: #e94560; margin-bottom: 12px; }
  .modal .note { padding: 8px 0; border-bottom: 1px solid #0f3460; font-size: 13px; }
  .modal .note .tags { color: #f0c040; font-size: 11px; margin-top: 4px; }
  .modal .close-btn { margin-top: 12px; text-align: right; }
  .modal .close-btn button { background: #e94560; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Sessions</h2>
  <div class="session-list" id="sessionList">
    <div style="color:#888;padding:12px;font-size:13px;">Loading...</div>
  </div>
  <div class="sidebar-actions">
    <button class="btn btn-new" onclick="newSession()">+ New Session</button>
    <button class="btn btn-notes" onclick="showNotes()">Knowledge Notes</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="header">
    <span id="sessionLabel">No session selected</span>
    <span class="status" id="statusLine"></span>
  </div>
  <div class="messages" id="messages">
    <div class="msg system">Select or create a session to start chatting</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Notes Modal -->
<div class="modal-overlay" id="notesModal">
  <div class="modal">
    <h3>Knowledge Notes</h3>
    <div id="notesContent"><div style="color:#888;">No notes yet.</div></div>
    <div class="close-btn"><button onclick="closeNotes()">Close</button></div>
  </div>
</div>

<script>
let currentSid = "";

// ---- Init ----
async function init() {
  const res = await fetch("/api/sessions");
  const ids = await res.json();
  const list = document.getElementById("sessionList");
  list.innerHTML = ids.length ? "" : '<div style="color:#888;padding:12px;font-size:13px;">No sessions yet</div>';
  ids.forEach(id => {
    const div = document.createElement("div");
    div.className = "session-item";
    div.textContent = id;
    div.onclick = () => loadSession(id);
    list.appendChild(div);
  });
}
init();

// ---- Session ----
async function newSession() {
  const res = await fetch("/api/sessions", { method: "POST" });
  const data = await res.json();
  selectSession(data.session_id);
  init();
}

async function loadSession(id) {
  const res = await fetch(`/api/sessions/${id}/load`, { method: "POST" });
  if (!res.ok) { alert("Session not found"); return; }
  const data = await res.json();
  selectSession(id);
  clearMessages();
  addSystemMsg(`${data.message_count} messages, ${data.notes_count} notes loaded`);
  // Render existing messages
  if (data.messages) {
    data.messages.forEach(m => {
      if (m.role === "user") addUserMsg(m.content);
      else if (m.role === "assistant" && m.content) addAgentMsg(m.content);
    });
  }
}

function selectSession(id) {
  currentSid = id;
  document.getElementById("sessionLabel").textContent = "Session: " + id;
  document.querySelectorAll(".session-item").forEach(el => {
    el.classList.toggle("active", el.textContent === id);
  });
}

// ---- Messages ----
function clearMessages() {
  document.getElementById("messages").innerHTML = "";
}
function addUserMsg(text) {
  const div = document.createElement("div");
  div.className = "msg user"; div.textContent = text;
  document.getElementById("messages").appendChild(div);
  scrollDown();
}
function addAgentMsg(text, trace) {
  const div = document.createElement("div");
  div.className = "msg agent";
  div.textContent = text;

  if (trace && trace.length > 0) {
    const tb = document.createElement("div");
    tb.className = "trace-block";
    trace.forEach(t => {
      if (t.tool) {
        const args = Object.entries(t.args || {}).map(([k,v]) => `${k}=${v}`).join(", ");
        tb.innerHTML += `<span class="tool-name">[${t.tool}]</span> <span class="tool-args">(${args})</span><br>`;
        if (t.result) tb.innerHTML += `<span class="tool-result">&rarr; ${t.result}</span><br>`;
      }
    });
    div.appendChild(tb);
  }
  document.getElementById("messages").appendChild(div);
  scrollDown();
}
function addSystemMsg(text) {
  const div = document.createElement("div");
  div.className = "msg system"; div.textContent = text;
  document.getElementById("messages").appendChild(div);
}
function scrollDown() {
  const el = document.getElementById("messages");
  el.scrollTop = el.scrollHeight;
}

// ---- Chat ----
async function sendMessage() {
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if (!msg || !currentSid) return;
  input.value = "";
  input.disabled = true;

  addUserMsg(msg);
  document.getElementById("statusLine").textContent = "Thinking...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ session_id: currentSid, message: msg }),
    });
    const data = await res.json();
    if (data.error) {
      addSystemMsg("Error: " + data.error);
    } else {
      addAgentMsg(data.answer, data.trace);
      document.getElementById("statusLine").textContent = data.steps + " step(s)";
    }
  } catch (e) {
    addSystemMsg("Connection error: " + e.message);
  }
  input.disabled = false;
  input.focus();
}

// ---- Notes ----
async function showNotes() {
  if (!currentSid) return;
  const res = await fetch(`/api/notes/${currentSid}`);
  const notes = await res.json();
  const content = document.getElementById("notesContent");
  if (!notes.length) {
    content.innerHTML = '<div style="color:#888;">No notes yet. Ask the agent to research something!</div>';
  } else {
    content.innerHTML = notes.map(n =>
      `<div class="note">
        <div>${n.content}</div>
        <div class="tags">${n.tags.map(t => '#'+t).join(' ')} | ${n.created_at}</div>
      </div>`
    ).join("");
  }
  document.getElementById("notesModal").classList.add("show");
}
function closeNotes() {
  document.getElementById("notesModal").classList.remove("show");
}
document.getElementById("notesModal").addEventListener("click", function(e) {
  if (e.target === this) closeNotes();
});
</script>
</body>
</html>
