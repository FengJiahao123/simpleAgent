<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Agent - Knowledge Assistant</title>
<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- LaTeX rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #d1d5db; height: 100vh; display: flex;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 240px; background: #16213e; display: flex; flex-direction: column;
    border-right: 1px solid #0f3460; flex-shrink: 0;
  }
  .sidebar h2 { padding: 14px 16px; font-size: 15px; color: #e94560; border-bottom: 1px solid #0f3460; }
  .session-list { flex: 1; overflow-y: auto; padding: 6px; }
  .session-item {
    padding: 8px 10px; cursor: pointer; border-radius: 4px; margin-bottom: 2px;
    font-size: 12px; transition: background .15s; word-break: break-all;
  }
  .session-item:hover { background: #0f3460; }
  .session-item.active { background: #e94560; color: #fff; }
  .sidebar-actions { padding: 10px; border-top: 1px solid #0f3460; }
  .btn {
    width: 100%; padding: 7px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 12px; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-new { background: #e94560; color: #fff; }
  .btn-notes { background: #0f3460; color: #ccc; margin-top: 5px; }

  /* ---- Main ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    padding: 10px 16px; background: #16213e; border-bottom: 1px solid #0f3460;
    font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .header .status { color: #4ecca3; font-size: 11px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.65;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: #e94560; color: #fff; }
  .msg.agent { align-self: flex-start; background: #0f3460; }
  .msg.system { align-self: center; background: transparent; color: #777; font-size: 11px; }

  /* Markdown inside agent messages */
  .msg.agent h1, .msg.agent h2, .msg.agent h3 { color: #f0c040; margin: 8px 0 4px; font-size: 14px; }
  .msg.agent h2 { font-size: 13px; }
  .msg.agent h3 { font-size: 12px; }
  .msg.agent p { margin: 4px 0; }
  .msg.agent ul, .msg.agent ol { margin: 4px 0; padding-left: 18px; }
  .msg.agent li { margin: 2px 0; }
  .msg.agent code {
    background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px;
    font-family: "Consolas", "Courier New", monospace; font-size: 12px;
  }
  .msg.agent pre {
    background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 4px;
    overflow-x: auto; font-size: 12px; margin: 6px 0;
  }
  .msg.agent pre code { background: none; padding: 0; }
  .msg.agent blockquote {
    border-left: 3px solid #e94560; padding-left: 10px; color: #aaa; margin: 6px 0;
  }
  .msg.agent a { color: #4ecca3; }
  .msg.agent strong { color: #f0c040; }
  .msg.agent table { border-collapse: collapse; margin: 6px 0; width: 100%; }
  .msg.agent th, .msg.agent td { border: 1px solid #1a1a2e; padding: 4px 8px; font-size: 12px; text-align: left; }
  .msg.agent hr { border: 0; border-top: 1px solid #1a1a2e; margin: 10px 0; }

  /* ---- Trace ---- */
  .trace-toggle {
    font-size: 11px; color: #888; cursor: pointer; margin-top: 6px;
    user-select: none; display: inline-block;
  }
  .trace-toggle:hover { color: #f0c040; }
  .trace-block {
    display: none; margin-top: 6px; padding: 8px; border-radius: 4px;
    background: rgba(0,0,0,0.25); font-size: 11px; color: #aaa; line-height: 1.5;
    font-family: "Consolas", "Courier New", monospace;
  }
  .trace-block.open { display: block; }
  .trace-block .tool-name { color: #f0c040; }
  .trace-block .tool-args { color: #888; }
  .trace-block .tool-result { color: #4ecca3; }
  .trace-step { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .trace-step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  /* ---- Input ---- */
  .input-area {
    padding: 10px 16px; background: #16213e; border-top: 1px solid #0f3460;
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1; padding: 10px 12px; border: 1px solid #0f3460; border-radius: 6px;
    background: #1a1a2e; color: #eee; font-size: 13px; font-family: inherit;
    outline: none; resize: none; min-height: 40px; max-height: 120px;
  }
  .input-area textarea:focus { border-color: #e94560; }
  .input-area button {
    padding: 10px 18px; border: none; border-radius: 6px;
    background: #e94560; color: #fff; cursor: pointer; font-size: 13px; flex-shrink: 0;
  }
  .input-area button:hover { opacity: 0.85; }

  /* ---- Notes Panel ---- */
  .notes-panel {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; justify-content: center; align-items: center;
  }
  .notes-panel.show { display: flex; }
  .notes-body {
    background: #16213e; border-radius: 10px; width: 85%; max-width: 800px;
    max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .notes-body h3 { padding: 16px 20px; color: #e94560; border-bottom: 1px solid #0f3460; font-size: 15px; }
  .notes-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .note-card {
    background: #0f3460; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
    font-size: 13px; line-height: 1.6;
  }
  .note-card .note-meta { font-size: 11px; color: #888; margin-bottom: 8px; }
  .note-card .note-meta .tag { color: #f0c040; margin-right: 6px; }
  .note-card .note-meta .source { color: #4ecca3; }
  .note-card .note-content { color: #d1d5db; }
  /* Markdown in notes */
  .note-card .note-content h1,.note-card .note-content h2,.note-card .note-content h3 { color: #f0c040; margin: 6px 0 4px; }
  .note-card .note-content code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 2px; }
  .note-card .note-content pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; overflow-x: auto; }
  .note-card .note-content ul,.note-card .note-content ol { padding-left: 18px; }
  .notes-close {
    padding: 10px 20px; border-top: 1px solid #0f3460; text-align: right;
  }
  .notes-close button {
    background: #e94560; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer;
  }

  /* KaTeX dark theme */
  .katex { color: #d1d5db; }
  .katex-display { margin: 8px 0; }
  .katex-html { overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2> Sessions</h2>
  <div class="session-list" id="sessionList">
    <div style="color:#666;padding:10px;font-size:12px;">Loading...</div>
  </div>
  <div class="sidebar-actions">
    <button class="btn btn-new" onclick="newSession()">+ New Session</button>
    <button class="btn btn-notes" onclick="showNotes()"> View Notes</button>
  </div>
</div>

<!-- Main Chat -->
<div class="main">
  <div class="header">
    <span id="sessionLabel" style="color:#888;">Select a session to start</span>
    <span class="status" id="statusLine"></span>
  </div>
  <div class="messages" id="messages">
    <div class="msg system"> Select or create a session to begin chatting</div>
  </div>
  <div class="input-area">
    <textarea id="userInput" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
      rows="1" onkeydown="handleInputKey(event)"></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Notes Panel -->
<div class="notes-panel" id="notesPanel">
  <div class="notes-body">
    <h3> Knowledge Notes</h3>
    <div class="notes-scroll" id="notesScroll">
      <div style="color:#666;">No notes yet. Ask the agent to research something!</div>
    </div>
    <div class="notes-close">
      <button onclick="closeNotes()">Close</button>
    </div>
  </div>
</div>

<script>
// ---- Markdown config ----
marked.setOptions({ breaks: true, gfm: true });

// ---- LaTeX rendering ----
function renderLatex(html) {
  // Render display math: $$...$$
  let result = html.replace(/\$\$([\s\S]*?)\$\$/g, function(match, formula) {
    try { return katex.renderToString(formula.trim(), { displayMode: true, throwOnError: false }); }
    catch(e) { return match; }
  });
  // Render inline math: $...$ (but not $$)
  result = result.replace(/(?<!\$)\$(?!\$)([\s\S]*?)(?<!\$)\$(?!\$)/g, function(match, formula) {
    try { return katex.renderToString(formula.trim(), { displayMode: false, throwOnError: false }); }
    catch(e) { return match; }
  });
  return result;
}

let currentSid = "";

// ---- Init ----
async function init() {
  const res = await fetch("/api/sessions");
  const ids = await res.json();
  const list = document.getElementById("sessionList");
  list.innerHTML = ids.length ? "" : '<div style="color:#666;padding:10px;font-size:12px;">No sessions yet</div>';
  ids.forEach(id => {
    const div = document.createElement("div");
    div.className = "session-item"; div.textContent = id;
    div.onclick = () => loadSession(id);
    list.appendChild(div);
  });
}
init();

// ---- Session ----
async function newSession() {
  const res = await fetch("/api/sessions", { method: "POST" });
  const data = await res.json();
  selectSession(data.session_id);
  init();
}

async function loadSession(id) {
  const res = await fetch(`/api/sessions/${id}/load`, { method: "POST" });
  if (!res.ok) { alert("Session not found"); return; }
  const data = await res.json();
  selectSession(id);
  clearMessages();
  if (data.message_count > 0)
    addSystemMsg(`Loaded ${data.message_count} messages, ${data.notes_count} notes`);
  else
    addSystemMsg(`Session loaded — ${data.notes_count} notes available`);

  (data.messages || []).forEach(m => {
    if (m.role === "user") addUserMsg(m.content);
    else if (m.role === "assistant" && m.content) addAgentMsg(m.content, null);
  });
}

function selectSession(id) {
  currentSid = id;
  document.getElementById("sessionLabel").textContent = "Session: " + id;
  document.querySelectorAll(".session-item").forEach(el => {
    el.classList.toggle("active", el.textContent === id);
  });
  document.getElementById("userInput").focus();
}

// ---- Messages ----
function clearMessages() { document.getElementById("messages").innerHTML = ""; }

function addUserMsg(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = escapeHtml(text);
  document.getElementById("messages").appendChild(div);
  scrollDown();
}

function addAgentMsg(text, trace) {
  const wrapper = document.createElement("div");
  wrapper.className = "msg agent";

  // Render markdown
  const body = document.createElement("div");
  body.className = "agent-body";
  body.innerHTML = renderLatex(marked.parse(text));
  wrapper.appendChild(body);

  // Trace (collapsible)
  if (trace && trace.length > 0) {
    const toggle = document.createElement("span");
    toggle.className = "trace-toggle";
    toggle.textContent = " Show trace (" + trace.length + " step(s))";
    toggle.onclick = function() {
      const tb = this.nextElementSibling;
      const open = tb.classList.toggle("open");
      this.textContent = open
        ? " Hide trace"
        : " Show trace (" + trace.length + " step(s))";
    };
    wrapper.appendChild(toggle);

    const tb = document.createElement("div");
    tb.className = "trace-block";
    trace.forEach((t, i) => {
      const step = document.createElement("div");
      step.className = "trace-step";
      if (t.tool) {
        const args = Object.entries(t.args || {}).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(", ");
        let resultHtml = escapeHtml((t.result || "").substring(0, 500));
        if ((t.result || "").length > 500) resultHtml += "...";

        // Detect data source
        let sourceBadge = "";
        if (t.result && t.result.includes("[SOURCE: Real Web Search]")) {
          sourceBadge = ` <span style="background:#4ecca3;color:#000;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:bold;">WEB</span>`;
        } else if (t.result && t.result.includes("[SOURCE: Local Cache")) {
          sourceBadge = ` <span style="background:#f0c040;color:#000;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:bold;">OFFLINE</span>`;
        } else if (t.result && t.result.includes("[SOURCE: LLM Knowledge]")) {
          sourceBadge = ` <span style="background:#e94560;color:#fff;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:bold;">LLM</span>`;
        }

        step.innerHTML = `<span class="tool-name">Step ${t.step}: ${t.tool}${sourceBadge}</span><br>
          <span class="tool-args">Args: ${escapeHtml(args)}</span><br>
          <span class="tool-result">Result: ${resultHtml}</span>`;
      } else if (t.action === "final_answer") {
        step.innerHTML = `<span style="color:#4ecca3;">Step ${t.step}: Final Answer</span>`;
      } else if (t.error) {
        step.innerHTML = `<span style="color:#e94560;">Step ${t.step}: Error — ${escapeHtml(t.error)}</span>`;
      }
      tb.appendChild(step);
    });
    wrapper.appendChild(tb);
  }

  document.getElementById("messages").appendChild(wrapper);
  scrollDown();
}

function addSystemMsg(text) {
  const div = document.createElement("div");
  div.className = "msg system"; div.textContent = text;
  document.getElementById("messages").appendChild(div);
}

function scrollDown() {
  const el = document.getElementById("messages");
  setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
}

// ---- Chat ----
function handleInputKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if (!msg || !currentSid) return;
  input.value = "";
  input.style.height = "40px";
  input.disabled = true;

  addUserMsg(msg);
  document.getElementById("statusLine").textContent = "Thinking...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ session_id: currentSid, message: msg }),
    });
    const data = await res.json();
    if (data.error) {
      addSystemMsg("Error: " + data.error);
      document.getElementById("statusLine").textContent = "Error";
    } else {
      addAgentMsg(data.answer, data.trace);
      document.getElementById("statusLine").textContent =
        data.steps + " step(s)" + (data.trace ? " | " + data.trace.filter(t=>t.tool).length + " tool(s)" : "");
    }
  } catch (e) {
    addSystemMsg("Connection error: " + e.message);
    document.getElementById("statusLine").textContent = "Error";
  }
  input.disabled = false;
  input.focus();
}

// ---- Auto-resize textarea ----
document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "40px";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// ---- Notes Panel ----
async function showNotes() {
  if (!currentSid) return;
  const res = await fetch(`/api/notes/${currentSid}`);
  const notes = await res.json();
  const container = document.getElementById("notesScroll");
  if (!notes.length) {
    container.innerHTML = '<div style="color:#666;">No notes yet. Try saying: "Research Transformer architecture and save detailed notes."</div>';
  } else {
    // Also try to list .md files
    let mdFiles = [];
    try {
      const fres = await fetch(`/api/notes/${currentSid}/files`);
      mdFiles = await fres.json();
    } catch(e) {}

    let html = `<div style="color:#888;margin-bottom:12px;">${notes.length} note(s)`;
    if (mdFiles.length > 0) html += ` | ${mdFiles.length} .md file(s) exported to <code>data/notes/${escapeHtml(currentSid)}/</code>`;
    html += `</div>`;

    html += notes.map((n, i) => {
      const meta = [];
      if (n.tags && n.tags.length) meta.push(n.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join(" "));
      if (n.source_url) meta.push(`<a class="source" href="${escapeHtml(n.source_url)}" target="_blank">Source</a>`);
      if (n.created_at) meta.push(`<span style="color:#666;">${escapeHtml(n.created_at.substring(0,10))}</span>`);

      return `<div class="note-card">
        <div class="note-meta">${meta.join(" &middot; ")}</div>
        <div class="note-content">${renderLatex(marked.parse(n.content))}</div>
      </div>`;
    }).join("");
    container.innerHTML = html;
  }
  document.getElementById("notesPanel").classList.add("show");
}

function closeNotes() {
  document.getElementById("notesPanel").classList.remove("show");
}
document.getElementById("notesPanel").addEventListener("click", function(e) {
  if (e.target === this) closeNotes();
});

// ---- Helpers ----
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
